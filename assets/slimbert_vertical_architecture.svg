<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc">
  <title id="title">SlimBERT Hangman model flow</title>
  <desc id="desc">A clean vertical diagram of the SlimBERT Hangman model with two separate inputs, shared layers, two output heads, and examples beside each node.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .input { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 10; }
      .layer { fill: #ecfdf5; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
      .merge { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .encoder { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 10; }
      .head { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 10; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; }
      .h { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .t { font: 13px Arial, sans-serif; fill: #334155; }
      .s { font: 12px Arial, sans-serif; fill: #64748b; }
      .mono { font: 12px "Courier New", monospace; fill: #1e293b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1100" height="860"/>

  <text class="title" x="550" y="52" text-anchor="middle">SlimBERT Hangman Model</text>

  <rect class="input" x="90" y="120" width="360" height="130"/>
  <text class="h" x="116" y="150">Input 1: Board Ids</text>
  <text class="s" x="116" y="174">Shape: [batch, length]</text>
  <text class="t" x="116" y="200">Example board:</text>
  <text class="mono" x="226" y="200">__E _A_RI_</text>
  <text class="t" x="116" y="224">Encoded:</text>
  <text class="mono" x="180" y="224">[1,1,6,28,1,2,1,19,10,1]</text>

  <rect class="input" x="650" y="120" width="360" height="130"/>
  <text class="h" x="676" y="150">Input 2: Missed Letters</text>
  <text class="s" x="676" y="174">Shape: [batch, 26]</text>
  <text class="t" x="676" y="200">Example missed:</text>
  <text class="mono" x="790" y="200">C, D, O</text>
  <text class="t" x="676" y="224">Vector:</text>
  <text class="mono" x="728" y="224">C,D,O = 1; others = 0</text>

  <rect class="layer" x="90" y="310" width="360" height="100"/>
  <text class="h" x="116" y="340">Token Embedding</text>
  <text class="s" x="116" y="364">Vocabulary size: 29</text>
  <text class="s" x="116" y="386">[PAD], [MASK], A-Z, space -> 256 dims</text>

  <rect class="layer" x="650" y="310" width="360" height="100"/>
  <text class="h" x="676" y="340">Missed-Letter Projection</text>
  <text class="s" x="676" y="364">Linear layer: 26 -> 256</text>
  <text class="s" x="676" y="386">Broadcast across all board positions</text>

  <rect class="merge" x="370" y="470" width="360" height="88"/>
  <text class="h" x="536" y="502">Add</text>
  <text class="t" x="424" y="528">board embedding + missed-letter embedding</text>

  <rect class="encoder" x="370" y="615" width="360" height="110"/>
  <text class="h" x="488" y="647">BERT Encoder</text>
  <text class="s" x="430" y="673">4 layers, hidden size 256, 8 attention heads</text>
  <text class="mono" x="438" y="699">sequence_output: [B, L, 256]</text>

  <rect class="head" x="120" y="770" width="360" height="78"/>
  <text class="h" x="146" y="798">MLM Head</text>
  <text class="s" x="146" y="820">Per blank position: [B, L, 29]</text>
  <text class="s" x="146" y="840">Example targets: T, H, M, T, X</text>

  <rect class="head" x="620" y="770" width="360" height="78"/>
  <text class="h" x="646" y="798">Letter Head</text>
  <text class="s" x="646" y="820">Whole-board A-Z scores: [B, 26]</text>
  <text class="s" x="646" y="840">Example target: H, M, T, X present</text>

  <path class="arrow" d="M270 250 L270 310"/>
  <path class="arrow" d="M830 250 L830 310"/>
  <path class="arrow" d="M270 410 C270 452, 404 452, 420 470"/>
  <path class="arrow" d="M830 410 C830 452, 696 452, 680 470"/>
  <path class="arrow" d="M550 558 L550 615"/>
  <path class="arrow" d="M540 725 L540 750 L300 750 L300 770"/>
  <path class="arrow" d="M560 725 L560 750 L800 750 L800 770"/>
</svg>
